<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Added | MealMate</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #fff4ef,
                #fff,
                #ffeef3
            );
        }

        /* Success Card */

        .success-card {
            width: 90%;
            max-width: 430px;

            background: white;

            padding: 45px 35px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);

            animation: cardShow 0.5s ease;
        }

        /* Check Icon */

        .check-icon {
            width: 85px;
            height: 85px;

            margin: 0 auto 22px;

            border-radius: 50%;

            background: #e8f8ed;

            color: #159447;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 42px;

            font-weight: bold;

            box-shadow:
                0 8px 20px rgba(21, 148, 71, 0.15);

            animation: pop 0.5s ease;
        }

        /* Main message */

        .success-card h1 {
            font-size: 28px;

            color: #222;

            margin-bottom: 12px;
        }

        .success-card h1 span {
            color: #ff4b2b;
        }

        .success-card p {
            color: #777;

            font-size: 15px;

            line-height: 1.6;
        }

        /* Small success label */

        .success-label {
            display: inline-block;

            margin-top: 22px;

            padding: 8px 18px;

            border-radius: 20px;

            background: #fff1ed;

            color: #ff4b2b;

            font-size: 13px;

            font-weight: 600;
        }

        /* Animation */

        @keyframes cardShow {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        @keyframes pop {

            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }

        }

        /* Mobile */

        @media (max-width: 500px) {

            .success-card {
                padding: 35px 25px;
            }

            .check-icon {
                width: 70px;
                height: 70px;
                font-size: 34px;
            }

            .success-card h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <div class="success-card">

        <div class="check-icon">
            ✓
        </div>

        <h1>
            Item Added to <span>Cart!</span>
        </h1>

        <p>
            Your delicious item has been
            successfully added to your cart. 🛒
        </p>

        <div class="success-label">
            ✓ Added Successfully
        </div>

    </div>

</body>

</html>
