
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In Failed | MealMate</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff5f5, #ffe8e8);
        }

        .error-card {
            width: 420px;
            max-width: 90%;
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .error-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #ffe5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e53935;
            font-size: 45px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #777;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .retry-btn {
            display: inline-block;
            text-decoration: none;
            background: #ff4d4d;
            color: white;
            padding: 13px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .retry-btn:hover {
            background: #d93636;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(255, 77, 77, 0.3);
        }

        .brand {
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
        }

        .brand span {
            color: #ff4d4d;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 35px 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="error-card">

        <div class="error-icon">
            ×
        </div>

        <h1>Sign-In Failed</h1>

        <p>
            Invalid username or password.<br>
            Please check your details and try again.
        </p>

        <a href="{% url 'signin' %}" class="retry-btn">
            Try Again
        </a>

        <div class="brand">
            Welcome to <span>MealMate</span>
        </div>

    </div>

</body>
</html>
