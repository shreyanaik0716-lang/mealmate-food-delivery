<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Mate | Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            padding: 60px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 48px;
            color: #ff5a36;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .tagline {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
            font-style: italic;
        }

        .welcome {
            font-size: 18px;
            color: #444;
            margin-bottom: 35px;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 280px;
            padding: 30px 25px;

            background: white;
            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;

            border-radius: 25px;

            text-decoration: none;
            color: white;

            font-size: 15px;
            font-weight: bold;

            transition: 0.3s;
        }

        .signup-btn {
            background: linear-gradient(135deg, #ff7043, #ff3d00);
        }

        .signin-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .tagline {
                font-size: 17px;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🍴</div>

        <h1>Meal Mate</h1>

        <p class="tagline">
            Your Hunger Mate! 😋
        </p>

        <p class="welcome">
            Welcome to Meal Mate! <br>
            Delicious meals, made simple.
        </p>

        <div class="options">

            <!-- New User -->
            <div class="card">

                <div class="card-icon">👋</div>

                <h3>New User?</h3>

                <p>
                    Create your account and start exploring delicious meals.
                </p>

                <a href="open_signup" class="btn signup-btn">
                    Sign Up
                </a>

            </div>


            <!-- Existing User -->
            <div class="card">

                <div class="card-icon">🔐</div>

                <h3>Existing User?</h3>

                <p>
                    Welcome back! Sign in to continue your Meal Mate journey.
                </p>

                <a href="open_signin" class="btn signin-btn">
                    Sign In
                </a>

            </div>

        </div>

        <div class="footer">
            © 2026 Meal Mate • Your Hunger Mate 🍽️
        </div>

    </div>

</body>
</html>
